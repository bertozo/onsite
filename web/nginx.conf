server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing (BrowserRouter) - unknown paths must still
    # serve index.html so the app's own router can take over, instead of a raw nginx 404.
    location / {
        try_files $uri /index.html;
    }
}
